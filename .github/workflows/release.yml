# Stages `@pepebits/search-builder` on a version tag, after the full suite passes.
#
# CI never publishes a live version. It runs `npm stage publish`, which puts the
# version on the registry in a non-public state; a maintainer then approves it
# with 2FA (`npm stage approve <stage-id>`, or on npmjs.com), which is when it
# goes live. That keeps a human in front of every publish even if a tag or an
# action in this workflow were compromised.
#
# No NODE_AUTH_TOKEN secret: npm's trusted publishing (OIDC, `id-token: write`)
# authenticates this workflow. It is configured on npmjs.com against this repo
# and this file, with direct publishing deliberately left off — staging is the
# only action it can take.
name: release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # Idempotent: a tag that matches a version already live on npm (e.g. 0.1.0,
      # published by hand to bootstrap trusted publishing) is a no-op, not a red
      # run. Also guards against a tag that does not match package.json. A
      # version that is already *staged* is not visible to `npm view`; staging
      # it again fails with a clear message, and the fix is to approve or reject
      # the pending stage.
      - id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "${GITHUB_REF_NAME#v}" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $VERSION" >&2; exit 1
          fi
          if npm view "@pepebits/search-builder@$VERSION" version >/dev/null 2>&1; then
            echo "@pepebits/search-builder@$VERSION is already live on npm; nothing to stage"
            echo "stage=false" >> "$GITHUB_OUTPUT"
          else
            echo "stage=true" >> "$GITHUB_OUTPUT"
          fi
      # Provenance is requested here, not in package.json: it needs a CI OIDC
      # provider, and a maintainer must still be able to publish from a laptop.
      - if: steps.check.outputs.stage == 'true'
        run: npm stage publish --provenance
