# Publishes `search-builder` on a version tag, after the full suite passes.
#
# No NODE_AUTH_TOKEN secret here on purpose: the package is published once
# locally first (`npm publish`, by a maintainer, outside CI), and from then
# on npm's trusted publishing (OIDC, via `id-token: write` below) is what
# authenticates this workflow — configured on npmjs.com against this repo
# and this workflow file after that first publish. Until that one-time setup
# is done, this job's `npm publish` step will fail with no token configured.
name: release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # Idempotent: a tag that matches a version already on npm (e.g. 0.1.0,
      # published by hand to bootstrap trusted publishing) is a no-op, not a
      # red run. Also guards against re-pushing a tag.
      - id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "${GITHUB_REF_NAME#v}" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $VERSION" >&2; exit 1
          fi
          if npm view "search-builder@$VERSION" version >/dev/null 2>&1; then
            echo "search-builder@$VERSION is already on npm; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.publish == 'true'
        run: npm publish
